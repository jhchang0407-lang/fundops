[project]
name = "fundops"
version = "0.1.0"
description = "AI-native personal investment operations platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "openai>=1.50",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.entry-points."fundops.agents"]
screener = "backend.agents.screener:ScreenerAgent"
thesis = "backend.agents.thesis:ThesisAgent"
ic_review = "backend.agents.ic_review:ICReviewAgent"
memo = "backend.agents.memo:MemoAgent"
library = "backend.agents.library:LibraryAgent"
portfolio = "backend.agents.portfolio:PortfolioAgent"
allocator = "backend.agents.allocator:AllocatorAgent"

[project.entry-points."fundops.connectors"]
fmp = "backend.connectors.fmp:FMPConnector"
sec_edgar = "backend.connectors.sec_edgar:SECEdgarConnector"

[tool.setuptools.packages.find]
include = ["backend*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
